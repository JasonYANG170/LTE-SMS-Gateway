<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · LTE & SMS Gateway</title>
  <script src="theme.js"></script>
  <script src="i18n.js?v=3.1"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body class="login-page">
  <label class="theme-control login-theme">主题 <select id="themeSelect" aria-label="界面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  <div class="login-language"><label class="theme-control language-control"><select id="languageSelect" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></label></div>
  <div class="login-container">
    <section class="login-art">
      <div class="brand"><span class="brand-icon">◈</span><span>LTE <b>Gateway</b><small>通信工作台</small></span></div>
      <div class="login-message"><p class="eyebrow">COMMUNICATION WORKSPACE</p><h2>连接每一路设备，<br>掌握每一条消息。</h2><p>在一个工作台中查看网络状态、管理短信收发与转发配置。</p></div>
      <small>LTE & SMS Gateway · 多路通信管理</small>
    </section>
    <main class="login-panel">
      <div class="login-box">
        <div class="login-header"><p class="eyebrow">WELCOME BACK</p><h1>登录工作台</h1><p>使用网关账号继续管理你的设备。</p></div>
        <form class="login-form" onsubmit="handleLogin(event)">
          <div class="login-error" id="loginError" role="alert"></div>
          <div class="form-group"><label for="username">用户名</label><input type="text" id="username" name="username" required autocomplete="username" placeholder="输入用户名"></div>
          <div class="form-group"><label for="password">密码</label><input type="password" id="password" name="password" required autocomplete="current-password" placeholder="输入密码"></div>
          <button type="submit" class="login-button">登录工作台</button>
          <p class="login-version">LTE&SMS-Gateway · v3.1.0</p>
        </form>
      </div>
    </main>
  </div>
  <script>
    async function handleLogin(event) {
      event.preventDefault();
      
      const button = event.target.querySelector('button[type=submit]');
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = window.GatewayI18n.t('正在登录…');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
          // 登录成功，跳转到主页
          window.location.href = '/';
        } else {
          // 显示错误信息
          errorDiv.textContent = window.GatewayI18n.t(result.error) || window.GatewayI18n.t('登录失败');
          errorDiv.classList.add('show');
          
          // 3秒后隐藏错误信息
          setTimeout(() => {
            errorDiv.classList.remove('show');
          }, 3000);
        }
      } catch (error) {
        errorDiv.textContent = window.GatewayI18n.t('网络错误，请重试');
        errorDiv.classList.add('show');
      } finally {
        button.disabled = false;
        button.textContent = window.GatewayI18n.t('登录工作台');
      }
    }
    const themeSelect = document.getElementById('themeSelect');
    themeSelect.value = window.getGatewayTheme();
    themeSelect.addEventListener('change', () => window.setGatewayTheme(themeSelect.value));
  </script>
</body>
</html>
